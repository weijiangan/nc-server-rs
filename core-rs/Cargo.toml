[workspace]
members = [
    "crates/nc-server",
    "crates/nc-db",
    "crates/nc-auth",
    "crates/nc-dav",
    "crates/nc-ocs",
    "crates/nc-files",
    "crates/nc-fastcgi",
    "crates/nc-preview",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "fs"] }
hyper = { version = "1", features = ["full"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "macros", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }

# Byte buffers
bytes = "1"

# Crypto (token hashing, checksums)
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
adler = "0.2"
hex = "0.4"
bcrypt = "0.15"
base64 = "0.22"

# UUID for request IDs
uuid = { version = "1", features = ["v4"] }

# Concurrent hash map (session cache — §7.9.5)
dashmap = "6.1"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config parsing
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Regex (no-alloc, no-proc-macro)
regex-lite = "0.1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Async utilities
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"

# Archive streaming (ZIP/TAR folder download, Phase 5.10)
# `zip` — buffered fallback for small archives (seekable writer needed)
zip = { version = "6", default-features = false, features = ["deflate"] }
tar = "0.4"
# `s-zip` — streaming ZIP for large archives (no seek, no temp file)
s-zip = "0.11"

# File time manipulation (Phase 5.x — chunked upload mtime/ctime)
filetime = "0.2"

# FastCGI client (async, Tokio-native) — used by nc-fastcgi (Phase 7.1)
# No explicit registry: resolved via crates-io → artifactory-remote replacement.
fastcgi-client = { version = "0.11", features = ["runtime-tokio"] }

# Internal crates
nc-db = { path = "crates/nc-db" }
nc-auth = { path = "crates/nc-auth" }
nc-dav = { path = "crates/nc-dav" }
nc-ocs = { path = "crates/nc-ocs" }
nc-files = { path = "crates/nc-files" }
nc-fastcgi = { path = "crates/nc-fastcgi" }
nc-preview = { path = "crates/nc-preview" }

[profile.release]
lto = "thin"
strip = true
