[workspace]
members = [
    "crates/nc-server",
    "crates/nc-db",
    "crates/nc-auth",
    "crates/nc-dav",
    "crates/nc-ocs",
    "crates/nc-files",
    "crates/nc-fastcgi",
    "crates/nc-preview",
    "crates/nc-difftest",
    "crates/nc-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "fs"] }
hyper = { version = "1", features = ["full"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client — the Imaginary preview-generation backend (Phase 11.4).  Scoped to
# that one client (loopback allowed there, nowhere global).  rustls keeps the build
# free of a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Object-safe async trait — the pluggable PreviewBackend (Phase 11.4).
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "json", "macros", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }

# Byte buffers
bytes = "1"

# Crypto (token hashing, checksums)
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
adler = "0.2"
hex = "0.4"
bcrypt = "0.15"
# Argon2 (PHP `password_hash` default → `oc_users.password` = `3|$argon2id$…`).
# Pure-Rust RustCrypto implementation; `PasswordHash` parses the PHC string and
# `Argon2::verify_password` dispatches on the embedded algorithm identifier
# (argon2id / argon2i / argon2d), matching PHP's `password_verify()`.
argon2 = "0.5"
base64 = "0.22"
# CRC-32 (ISO 3309 / zlib polynomial) — matches PHP `crc32()` for the snowflake
# `serverid` fallback (`crc32(hostname)`, Phase 11.5).
crc32fast = "1"
# Hostname for the snowflake `serverid` fallback (Phase 11.5).
gethostname = "0.4"

# UUID for request IDs
uuid = { version = "1", features = ["v4"] }

# Concurrent hash map (session cache — §7.9.5)
dashmap = "6.1"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config parsing
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Regex (no-alloc, no-proc-macro)
regex-lite = "0.1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Async utilities
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"

# Archive streaming (ZIP/TAR folder download, Phase 5.10)
# `zip` — buffered fallback for small archives (seekable writer needed)
zip = { version = "6", default-features = false, features = ["deflate"] }
tar = "0.4"
# `s-zip` — streaming ZIP for large archives (no seek, no temp file)
s-zip = "0.11"

# File time manipulation (Phase 5.x — chunked upload mtime/ctime)
filetime = "0.2"

# FastCGI client (async, Tokio-native) — used by nc-fastcgi (Phase 7.1)
# No explicit registry: resolved via crates-io → artifactory-remote replacement.
fastcgi-client = { version = "0.11", features = ["runtime-tokio"] }

# Differential-test harness (Phase 16): YAML scenarios/column-registry + unified diffs.
serde_yaml = "0.9"
similar = "2"
pretty_assertions = "1"

# Internal crates
nc-db = { path = "crates/nc-db" }
nc-auth = { path = "crates/nc-auth" }
nc-dav = { path = "crates/nc-dav" }
nc-ocs = { path = "crates/nc-ocs" }
nc-files = { path = "crates/nc-files" }
nc-fastcgi = { path = "crates/nc-fastcgi" }
nc-preview = { path = "crates/nc-preview" }
nc-difftest = { path = "crates/nc-difftest" }

[profile.release]
lto = "thin"
strip = true

# Profiling build (Phase 17): release-level optimization but with symbols kept,
# so pprof-rs flamegraphs resolve function names.  Build with
# `cargo build --release --profile profiling` (note: --release + --profile
# selects this profile; `--profile profiling` alone also works).
[profile.profiling]
inherits = "release"
strip = false
debug = "limited"

# NEXTCLOUD-RS: vendored dav-server — upstream
# https://github.com/messense/dav-server-rs, branch `nextcloud-0.11.0` based
# on tag v0.11.0 (byte-identical to the crates.io tarball; verify with
# `git diff v0.11.0` inside vendor/dav-server).  Carries the PHASE-12.1
# patch set for PHP/SabreDAV PROPFIND parity:
#   - requested-but-unavailable properties are grouped into a 404 propstat
#     instead of being silently dropped (RFC 4918 §9.1),
#   - filesystem-driver properties are filtered to the client's requested
#     set on explicit <prop> requests (allprop/propname unchanged),
#   - collections report {DAV:}getcontenttype in the 404 propstat rather
#     than as "httpd/unix-directory".
[patch.crates-io]
dav-server = { path = "vendor/dav-server" }
