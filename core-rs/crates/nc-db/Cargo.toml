[package]
name = "nc-db"
description = "DB pool, migrations, startup caches (mime types, app config)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[dependencies]
sqlx.workspace = true
# Internal sqlx modules the umbrella crate does not re-export: the native
# postgres/sqlite argument + row + statement types (per-variant queries,
# PHASE-22 T3.3 — the `any` driver is gone).  Feature unification with
# `sqlx` provides the postgres/sqlite capabilities.
sqlx-core = { version = "0.8", default-features = false }
sqlx-postgres = { version = "0.8", default-features = false }
sqlx-sqlite = { version = "0.8", default-features = false }
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex-lite.workspace = true
futures.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
