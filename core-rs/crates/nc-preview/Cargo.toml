[package]
name = "nc-preview"
description = "Native preview/thumbnail fast path — provider registry, size bucketing, oc_previews store, isolated generation backend (Phase 11)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# size negotiation (size.rs) is dependency-free pure logic.
# store.rs: md5-sharded byte-path construction + oc_previews read (LocalPreviewStorage
# / PreviewMapper parity).
md-5.workspace = true
hex.workspace = true
nc-db.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
# RFC 7231 HTTP-date formatting for Last-Modified/Expires (matches nc-dav's dep).
httpdate = "1"
# Shared futures for request coalescing (concurrency.rs).
futures.workspace = true
# Generation backend (backend.rs): the Imaginary HTTP client + pluggable trait.
reqwest.workspace = true
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
# Imaginary `operations` query-param JSON (format.rs) — must serialize byte-identical
# to PHP's json_encode (field order preserved by serde derive).
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# Mock Imaginary server for the round-trip test (backend.rs).
axum.workspace = true
