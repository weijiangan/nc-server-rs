# Phase 16.11 — preview row shape (DB oracle). Upload a previewable image, then
# request a preview so generation happens synchronously on both sides; compare
# the resulting oc_previews rows (natural key mirrors previews_file_uniq_idx;
# ids are snowflakes). Generated BYTES are out of scope (appdata is excluded
# from the fs snapshot by construction).
#
# Grounded live behavior (2026-08-05): an image PUT does NOT queue
# oc_preview_generation on either side (previewgenerator queues text/plain but
# empirically not image/png), so this scenario is deterministic w.r.t. the
# cron-driven pre-generation. The first GET generates (PHP on both sides while
# Imaginary is down — the SUT proxies the miss); the second GET exercises the
# cache-hit path (native on the SUT per Phase 11.2). mtime is generation
# wall-time, hence timestamp_wall masking.
name: 25_preview_image
ops:
  - op: put
    path: /remote.php/dav/files/admin/preview-target.png
    body_file: preview-image.png
  - op: get
    path: /core/preview.png?file=preview-target.png&x=64&y=64
  - op: get
    path: /core/preview.png?file=preview-target.png&x=64&y=64
cleanup:
  # Hard delete (both sides support X-NC-Skip-Trashbin, PHP Storage.php:128):
  # keeps trash rows out of future deltas. The preview rows become orphans —
  # PHP never cleans previews on hard delete; they stay out of later deltas
  # because they are unchanged between those runs' snapshots.
  - op: delete
    path: /remote.php/dav/files/admin/preview-target.png
    headers:
      X-NC-Skip-Trashbin: "true"
