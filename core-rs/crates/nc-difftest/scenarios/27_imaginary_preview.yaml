# Phase 16.11 — Imaginary-enabled preview parity (resumed 2026-08-09).
#
# With `previews_hpb` (aio-imaginary) up and `preview_imaginary_url` +
# `OC\Preview\Imaginary` configured on BOTH instances (the OCC-based
# scripts/enable-preview-imaginary.sh), preview generation goes through ONE
# shared Imaginary: the SUT generates NATIVELY (Rust preview_gen ->
# ImaginaryClient, max-first model) and the oracle via PHP Imaginary.php.
# The generated BYTES must be byte-identical — `compare_bytes` asserts
# exactly that (upgrade over 25's row-shape-only scope, whose byte caveat
# was "unless the same Imaginary is configured for both instances").
#
# Byte determinism grounded (2026-08-09): libvips is deterministic; a
# delete-preview-state-and-regenerate probe reproduced the identical bytes
# on both sides, and Rust-native vs PHP-generated bytes were `cmp`-clean.
#
# Determinism w.r.t. background jobs: image PUTs do NOT queue
# oc_preview_generation (16.11 finding #30), so generation happens
# synchronously inside the first preview GET — the miss is real, not
# pre-empted by the previewgenerator cron.
name: 27_imaginary_preview
ops:
  - op: put
    path: /remote.php/dav/files/admin/imaginary-target.png
    body_file: preview-image.png
  # Fresh miss: both sides generate through Imaginary. Byte-exact.
  - op: get
    path: /core/preview.png?file=imaginary-target.png&x=64&y=64
    compare_bytes: true
  # Cache hit: each side serves its own stored bytes (SUT native / PHP).
  - op: get
    path: /core/preview.png?file=imaginary-target.png&x=64&y=64
    compare_bytes: true
  # Second bucket size (crop of the 320x200 source): broader op coverage.
  - op: get
    path: /core/preview.png?file=imaginary-target.png&x=128&y=128
    compare_bytes: true
cleanup:
  # Hard delete (both sides support X-NC-Skip-Trashbin, PHP Storage.php:128):
  # keeps trash rows out of future deltas. The preview rows become orphans —
  # PHP never cleans previews on hard delete; they stay out of later deltas
  # because they are unchanged between those runs' snapshots.
  - op: delete
    path: /remote.php/dav/files/admin/imaginary-target.png
    headers:
      X-NC-Skip-Trashbin: "true"
