# Known-divergence inventory (Phase 16.12).
#
# Every INTENTIONAL divergence the SUT keeps against PHP is itemized here —
# with the WHY (the PHP bug or requirement driving it) and a `status` — so
# each can be tracked and removed later.  The scenario runner matches its
# structured divergences against this file: an unlisted divergence fails the
# run; a listed one is reported as KNOWN DIVERGENCE (inventory id) and does
# not fail it.
#
# Statuses:
# - `accepted` — intentional: the SUT deliberately differs (PHP bug /
#   REQ-driven), documented with the rationale and a `revisit` hint.
# - `noise` — a harness artifact (e.g. second-boundary sentinel-label
#   differences whose raw values are verified equal), not a behavior gap.
#
# Matching: table equal, the row key starts with `key`, the record's
# `columns` are empty or cover the row's divergent columns, and the record's
# `scenarios` are empty or contain the scenario name.

- id: home-root-size
  why: >-
    PHP's home-root size is never recomputed: Cache::calculateFolderSizeInner
    (Cache.php:1023) compares the integer mimetype against the string
    MIMETYPE_FOLDER with strict === (always false), so correctFolderSize is a
    no-op and the root is updated only by size-delta propagateChanges
    (overwrites, assembly source-chain removals).  Live-verified 2026-08-07:
    the oracle root is frozen across PUT/DELETE/COPY/OVERWRITE.  Rust
    recomputes the actual sum of all children (files + trash + versions +
    cache + uploads) — the correct usage value — per CLAUDE.md principle 5
    (don't replicate PHP bugs).  The #1 divergence from the 16.4 record.
  status: accepted
  revisit: "when the PHP mimetype comparison is fixed upstream, or if clients are found to depend on PHP's stale root size"
  scenarios:
    - 10_put_get
    - 10_put_get_delete
    - 11_mkdir_nested
    - 12_move_rename
    - 13_copy
    - 16_overwrite_put
    - 17_delete_to_trash
    - 18_explicit_mtime
    - 20_chunked_upload_v2
    - 24_checksum_upload
    - 25_preview_image
    - 26_preview_unpreviewable
    - 27_imaginary_preview
  table: oc_filecache
  # Canonical natural key: the storage label + the path concatenated — the
  # home root row's key is exactly "home::admin" (empty path).
  key: "home::admin\u0001"
  columns: [size]

- id: checksum-verification
  why: >-
    The SUT verifies the OC-Checksum header against the uploaded bytes (REQ
    §13.1) and rejects a mismatch with 400; PHP stores the header verbatim
    unverified (File.php:374-380) — live-verified the oracle accepted a
    deliberately wrong SHA1 with 204.  Legitimate clients send correct
    checksums, so the verification does not affect them; kept per REQ §13.1.
    Scenario 24's recorded intent (the 16.10 notes).
  status: accepted
  revisit: "if REQ §13.1 is relaxed, or the verification must mirror PHP's laxness for third-party tooling"
  scenarios: [24_checksum_upload]
  table: oc_filecache
  key: "home::admin\u0001files/checksummed"
  # `etag` too: the rejected overwrite leaves the SUT row's etag unchanged
  # while the accepted PHP overwrite bumps it — the same intentional class.
  columns: [checksum, etag]

# Consequence of checksum-verification: the SUT's rejected overwrite creates
# no version rows, while PHP accepts the write unverified and creates the
# oc_filecache `files_versions` dir + file rows, the extended row, and the
# oc_files_versions entity.  The scenario's second PUT carries
# `compare_status: false` — the statuses still print, only the equality
# assertion is skipped.
- id: checksum-reject-version-rows
  why: >-
    The rejected overwrite (SUT 400 on the wrong OC-Checksum, REQ §13.1)
    leaves the version tree untouched; the accepted PHP overwrite (204)
    creates the files_versions dir + version-file rows.  Same intentional
    class as checksum-verification; no behavior gap.
  status: accepted
  revisit: "with checksum-verification"
  scenarios: [24_checksum_upload]
  table: oc_filecache
  key: "home::admin\u0001files_versions"
  columns: []

- id: checksum-reject-version-extended
  why: >-
    The oracle-only files_versions version-file row carries its extended row
    (creation_time/upload_time); the SUT rejected the write, so no extended
    row.  Same intentional class as checksum-verification.
  status: accepted
  revisit: "with checksum-verification"
  scenarios: [24_checksum_upload]
  table: oc_filecache_extended
  key: "home::admin\u0001files_versions/checksummed"
  columns: []

- id: checksum-reject-version-entity
  why: >-
    The oracle-only oc_files_versions entity for the accepted overwrite
    (metadata {"author":"admin"}); the SUT rejected the write, so no entity.
    Same intentional class as checksum-verification.
  status: accepted
  revisit: "with checksum-verification"
  scenarios: [24_checksum_upload]
  table: oc_files_versions
  key: "home::admin\u0001files_versions/checksummed"
  columns: []

- id: replay-second-boundary
  why: >-
    The sequential SUT-then-oracle replay can straddle a second boundary, so
    the per-row timestamp/volatile sentinel labels (TS/VV) can differ between
    the sides for the SAME raw values — verified equal via direct DB queries
    (e.g. files/ storage_mtime).  Pre-state residues (accumulated runs) shift
    the before-etag labels the same way.  Not a behavior difference.
  status: noise
  revisit: "a clock-synchronized replay or per-side raw-value comparison would remove the class"
  scenarios:
    - 10_put_get
    - 10_put_get_delete
    - 11_mkdir_nested
    - 12_move_rename
    - 13_copy
    - 16_overwrite_put
    - 17_delete_to_trash
    - 18_explicit_mtime
    - 20_chunked_upload_v2
    - 24_checksum_upload
    - 25_preview_image
    - 26_preview_unpreviewable
    - 27_imaginary_preview
  table: oc_filecache
  key: ""
  # `mtime` too: 18's stable_overrides compare mtime verbatim, and the
  # sequential replay's second-boundary straddle shows as a before-mtime
  # label difference (the after-values are the same generation instant).
  columns: [size, etag, mtime, storage_mtime]

# The nc-server's background-job loop (and PHP's request-triggered cron) bump
# the heartbeat appconfig rows on their own schedules; when a bump lands inside
# a replay window, the changed row's key (which embeds the new value) diverges
# between the sides — pure timing, the rows keep moving on both sides.  Not a
# behavior difference.  Blanket (scenarios empty): any scenario can catch a
# bump.  Live-verified: the bumps are heartbeat-only, both sides' jobs run
# identically.
- id: background-job-lastjob-heartbeat
  why: >-
    The backgroundjob app's `lastjob` configvalue is bumped on every job-loop
    run; the canonical key embeds the value, so an in-window bump makes the
    changed row diverge between the sides.  Both sides' loops run the same
    jobs — timing only.
  status: noise
  revisit: "quiesce the job loop for the replay, or drop the configvalue from the appconfig key"
  scenarios: []
  table: oc_appconfig
  key: "backgroundjob|lastjob"
  columns: []

- id: background-job-lastcron-heartbeat
  why: >-
    The core app's `lastcron` configvalue is bumped when a cron heartbeat
    lands in the replay window — timing only, both sides' crons run.
  status: noise
  revisit: "with background-job-lastjob-heartbeat"
  scenarios: []
  table: oc_appconfig
  key: "core|lastcron"
  columns: []

- id: circles-maintenance-heartbeat
  why: >-
    The circles app's `maintenance_update` JSON configvalue embeds run
    timestamps; a maintenance run landing in the replay window changes the
    row on one side only — timing only, both sides run the same maintenance.
  status: noise
  revisit: "with background-job-lastjob-heartbeat"
  scenarios: []
  table: oc_appconfig
  key: "circles|maintenance_update"
  columns: []

# The preview-lifecycle timing class (the async queue drain + generation
# landing inside a replay window) is NOT inventoried as noise — masking it
# would hide real preview-parity gaps (16.10's #33 class).  The runner
# instead quiesces deterministically: `quiesce_background` triggers each
# side's cron before every snapshot and waits for oc_preview_generation to
# drain (bounded).  The residual mid-window 5-minute cron is rare; if it
# lands in a window, the run fails loudly rather than masking.
